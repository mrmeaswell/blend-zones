# Bay Log — nginx front end.
#
# HTTP only as installed. Canvas requires HTTPS for an LTI launch, so
# before wiring the Developer Key either run certbot against this server
# block or terminate TLS upstream (pfSense/HAProxy, Cloudflare Tunnel).
# See docs/runbook.md — "Getting to HTTPS".

upstream blendzone_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Photo uploads from a phone can be large; the app caps at 15 MB.
    client_max_body_size 20m;
    client_body_timeout 120s;

    access_log /var/log/nginx/blendzone.access.log;
    error_log  /var/log/nginx/blendzone.error.log;

    # Don't advertise the version to the lab network.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://blendzone_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Health endpoint kept out of the access log so monitoring doesn't
    # drown the real traffic.
    location = /api/health {
        access_log off;
        proxy_pass http://blendzone_app;
        proxy_set_header Host $host;
    }
}

# ------------------------------------------------------------------
# When Canvas needs to launch this tool, X-Frame-Options SAMEORIGIN
# above will block the iframe. Replace it in the HTTPS server block with
# your Canvas host, e.g.:
#
#   add_header Content-Security-Policy
#       "frame-ancestors https://<your-institution>.instructure.com" always;
#
# and drop the X-Frame-Options header entirely (CSP frame-ancestors
# supersedes it and X-Frame-Options cannot express a specific allowed
# origin in a way modern browsers honor).
# ------------------------------------------------------------------
